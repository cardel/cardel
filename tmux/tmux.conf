# =============================================================================
# tmux.conf -- tuned for Claude Code TUI on Alacritty + zsh (Arch Linux)
# Source of truth: ~/repositorios/cardel/tmux/tmux.conf
# Symlinked from ~/.tmux.conf
# Tested with tmux 3.6a, alacritty 0.17, JetBrainsMono Nerd Font.
# =============================================================================

# ---- Terminal capabilities --------------------------------------------------
# Inside tmux, advertise tmux-256color as the baseline terminfo.
set -g default-terminal "tmux-256color"

# Promote modern features per outer terminal. tmux array syntax:
#   one entry per `set -as` line, features inside are COLON-separated
#   (commas separate array entries, so they cannot be used inside one).
# Features used here:
#   RGB        24-bit truecolor (Claude Code diffs/highlights look correct)
#   usstyle    undercurl + colored underline (LSP/error hints)
#   clipboard  OSC 52 system-clipboard yank (no xclip dependency)
#   hyperlinks OSC 8 clickable URLs in tool output
#   title      window title forwarding to outer terminal
#   focus      focus-in/out events (vim, lazygit, Claude Code react to them)
#   extkeys    CSI-u modified keys (Ctrl+Shift+Arrow, Alt+key, ...)
#   sixel      image rendering on terminals that support it
set -as terminal-features ",alacritty:RGB:usstyle:clipboard:hyperlinks:title:focus:extkeys:sixel"
set -as terminal-features ",xterm-256color:RGB:usstyle:clipboard:hyperlinks:title:focus:extkeys"
set -as terminal-features ",tmux-256color:RGB:usstyle:clipboard:hyperlinks:title:focus:extkeys"

# Belt-and-braces truecolor flag for clients that key off termcap names.
set -as terminal-overrides ",alacritty*:Tc"
set -as terminal-overrides ",xterm-256color:Tc"

# ---- Latency / responsiveness ----------------------------------------------
# Default 500 ms makes ESC and TUI redraws feel laggy. 10 ms is the standard fix.
set -sg escape-time 10
set -g  status-interval 5
set -g  aggressive-resize on
set -g  focus-events on
set -g  extended-keys on
# Allow inner apps (kitty graphics, OSC 52, custom escape sequences) through.
set -g  allow-passthrough on
set -g  set-titles on
set -g  set-titles-string "tmux: #S / #W"

# ---- History ----------------------------------------------------------------
# Claude Code is verbose; keep generous scrollback.
set -g history-limit 100000

# ---- Mouse / clipboard ------------------------------------------------------
set -g mouse on
# Yank to system clipboard via OSC 52 (works under Wayland and X11).
set -g set-clipboard on

# ---- Indexing ---------------------------------------------------------------
set  -g base-index 1
setw -g pane-base-index 1
set  -g renumber-windows on

# ---- Window naming ----------------------------------------------------------
# Don't let shell prompts overwrite a manually named window (e.g. "claude").
setw -g automatic-rename off
set  -g allow-rename off

# ---- Key bindings -----------------------------------------------------------
# Prefix stays C-b (no zsh conflict, no muscle-memory rewiring).

# Reload config without restarting tmux.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Splits keep the current path; mnemonic | for vertical, - for horizontal.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Repeatable resize (hold prefix, tap H/J/K/L).
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switch.
bind -n M-Left  previous-window
bind -n M-Right next-window

# ---- Copy mode --------------------------------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard 2>/dev/null"

# ---- Status bar -------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=default,fg=colour244"
set -g status-left-length  40
set -g status-right-length 80
set -g status-left  "#[fg=colour167,bold] #S #[fg=colour244]| "
set -g status-right "#[fg=colour244]#{?client_prefix,#[fg=colour167]* ,}#[fg=colour244]%Y-%m-%d #[fg=colour250]%H:%M "

setw -g window-status-format         " #I:#W "
setw -g window-status-current-format "#[fg=colour167,bold] #I:#W "
setw -g window-status-current-style  "fg=colour167,bold"

# Subtle pane borders.
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour167"

# Messages.
set -g message-style "bg=colour237,fg=colour167"

# ---- Activity ---------------------------------------------------------------
setw -g monitor-activity on
set  -g visual-activity off
