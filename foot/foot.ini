# foot.ini -- terminal para programar, tema oscuro.
# Fuente de verdad: ~/repositorios/cardel/foot/foot.ini
# Medido con foot 1.28.0, Hyprland 0.56.2, tmux 3.7c, Wayland, JetBrainsMono NF.
#
# OJO CON DONDE SE INSTALA: este archivo NO se enlaza en
# ~/.config/foot/foot.ini. Ese archivo lo *genera* ~/.local/bin/refresh.sh
# concatenando cuatro y redirigiendo con `>`, y `>` sigue los symlinks: el
# repositorio quedaria machacado con lo que escupa pywal. Va enlazado en
# ~/.config/foot/overrides_colors.ini, que es el ultimo de la concatenacion y
# por tanto el que gana. El porque completo esta en README.md.
#
# Validar cualquier cambio antes de creerselo:  foot --check-config -c foot.ini
# Devuelve 230 si hay una opcion que no existe, 0 si esta bien.

[main]
# foot instala el terminfo `foot`; `foot-extra` NO esta en esta maquina
# (medido con infocmp), asi que no se pone. Se declara explicito por lo mismo
# que alacritty.toml declara el suyo: un lanzador .desktop puede vaciar TERM.
term=foot

# La familia exacta, no la aproximada. defaults.ini pedia "JetBrainsMonoNF",
# que no existe como familia: fontconfig lo resolvia por parecido a
# "JetBrainsMono Nerd Font" -- la variante de ancho *proporcional*, donde los
# iconos Nerd ocupan dos celdas. La que quiere un terminal es la Mono, que es
# ademas la que ya usan alacritty.toml y tmux.conf.
font=JetBrainsMono Nerd Font Mono:size=11
font-bold=JetBrainsMono Nerd Font Mono:size=11:weight=bold
font-italic=JetBrainsMono Nerd Font Mono:size=11:slant=italic
font-bold-italic=JetBrainsMono Nerd Font Mono:size=11:weight=bold:slant=italic
font-size-adjustment=0.5

# line-height y letter-spacing se quedan SIN tocar a proposito, y no es
# descuido. yazi/yazi.toml le pasa a chafa `--font-ratio 600/1320`, que es la
# forma de la celda calculada a partir de las metricas de esta fuente (avance
# 600, ascenso 1020 + descenso 300). Cualquiera de las dos opciones cambia esa
# relacion y las vistas previas de imagen salen estiradas. Si algun dia se
# tocan, hay que recalcular ese numero.

# gamma-correct-blending se queda APAGADO, que es el valor de fabrica. foot
# 1.28 lo ofrece y es como se deberian mezclar los glifos (en espacio lineal),
# pero pide superficies de 16 bits y Hyprland 0.56.2 no las implementa: foot
# avisa "16-bit surfaces requested, but compositor does not implement
# ABGR161616+XBGR161616" y cae a 8 bits. Medido, activandolo con -o.

dpi-aware=no
pad=8x6
# Ancho de arranque; bajo Hyprland en mosaico lo decide el compositor, pero
# manda cuando la ventana sale flotante (regla `floating` de overrides.conf).
initial-window-size-chars=110x30
resize-delay-ms=100

# _ - . / NO son separadores: un doble clic coge entero `nombre_variable`,
# `mi-paquete`, `modulo.submodulo.funcion` y `src/main.rs`. Esta es la lista
# por defecto de foot, escrita aqui para que se vea que es deliberada.
word-delimiters=,│`|:"'()[]{}<>

# La seleccion va al primario (clic central). Poner `both` haria que cualquier
# arrastre con el raton pisara el portapapeles.
selection-target=primary

# foot dibuja las cajas el mismo en vez de usar los glifos de la fuente: las
# lineas del statusline de tmux y de los marcos de Claude Code quedan sin
# cortes entre celdas.
box-drawings-uses-font-glyphs=no
bold-text-in-bright=no

[bell]
# Para compilaciones largas: si el BEL llega con la ventana sin foco, Hyprland
# marca urgencia y salta una notificacion. Sin flash visual, que molesta.
urgent=yes
notify=yes
visual=no
system=no

[scrollback]
# tmux ya guarda 100k lineas; este buffer es solo para lo que corre fuera de
# tmux, asi que no hace falta que sea enorme. Igual que en alacritty.toml.
lines=10000
multiplier=3
indicator-position=relative
indicator-format=line

[cursor]
style=block
# Hueco cuando el foco esta en otra ventana: se ve de un vistazo en cual de
# los cuatro terminales se esta escribiendo.
unfocused-style=hollow
blink=no

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
osc8-underline=always
style=curly
label-letters=sadfjklewcmpgh

# --- Expresiones propias, para codigo ---------------------------------------
# Se usan desde [key-bindings] con regex-copy: foot etiqueta cada coincidencia
# visible con una letra y copia la que se elija. No lanzan nada, asi que no
# dependen de ningun programa externo.

# ruta:linea(:columna) -- lo que escupen gcc, eslint, pytest, rg y los stack
# traces. Copiarlo tal cual es lo que se pega en un issue o en Claude Code.
[regex:ubicacion]
regex=([~./[:alnum:]_-]+\.[[:alnum:]]+:[0-9]+(:[0-9]+)?)

# Hashes de git, de 7 a 40 caracteres.
[regex:hash]
regex=(\b[a-f0-9]{7,40}\b)

[csd]
# Hyprland ya pone borde y titulo; la decoracion de foot solo roba pixeles.
preferred=none

[key-bindings]
# Lo que ya trae foot y no se toca:
#   Ctrl+Shift+c/v  copiar/pegar        Ctrl+Shift+r  buscar en el historial
#   Ctrl+Shift+n    terminal nuevo      Ctrl+Shift+o  abrir URL
#   Ctrl+Shift+u    entrada unicode     Ctrl +/-/0    tamano de letra
# Nada de lo de abajo pisa a tmux, cuyo prefijo es C-b.

# Media pagina, como C-u/C-d de vim y less. En k/j y no en u/d porque
# Ctrl+Shift+u ya es unicode-input y chocarian.
scrollback-up-half-page=Control+Shift+k
scrollback-down-half-page=Control+Shift+j
scrollback-home=Control+Shift+Home
scrollback-end=Control+Shift+End

# Claro/oscuro al vuelo. Es lo que hace falta al proyectar en clase, donde el
# fondo casi negro se ve gris sucio y el texto tenue desaparece.
color-theme-toggle=Control+Shift+t

# URL al portapapeles en vez de abrirla en el navegador.
show-urls-copy=Control+Shift+y

# Copiar una ubicacion de error o un hash sin tocar el raton.
regex-copy=[ubicacion] Control+Shift+f
regex-copy=[hash] Control+Shift+g

# Todo el historial de la ventana, abierto en nvim al final. Sirve para
# rebuscar en la salida de una compilacion con las herramientas de siempre.
pipe-scrollback=[sh -c "f=$(mktemp) && cat > $f && foot nvim + $f; rm -f $f"] Control+Shift+p

[tweak]
# foot procesa sixel, que es lo que alacritty no tiene. Es la razon por la que
# aqui si se pueden ver imagenes de verdad en yazi. Viene activado de fabrica;
# se deja escrito para que no se apague sin darse cuenta.
sixel=yes
grapheme-shaping=yes

# ---------------------------------------------------------------------------
# Colores. Es la misma paleta que alacritty/alacritty.toml: Nord (aurora y
# frost) sobre un fondo casi negro en vez del #2e3440 lavado del Nord
# original. Asi los tres -- foot, alacritty y el statusline de tmux -- pintan
# el mismo rojo y el mismo verde, y un tema no desmiente al otro.
#
# La seccion se llama [colors-dark]: [colors] sigue funcionando pero foot 1.27
# la marca `deprecated` y suelta un aviso por cada clave (medido). La plantilla
# de pywal en ~/.config/wal/templates/foot.base.ini todavia escribe [colors].
#
# Para cambiar de tema entero, foot trae 80 en /usr/share/foot/themes/ y basta
# una linea; ver README.md.
# ---------------------------------------------------------------------------

[colors-dark]
background=0f1115
foreground=d8dee9
# texto  fondo-del-cursor
cursor=0f1115 d8dee9

regular0=1c1f26
regular1=bf616a
regular2=a3be8c
regular3=ebcb8b
regular4=81a1c1
regular5=b48ead
regular6=88c0d0
regular7=d8dee9

bright0=4c566a
bright1=d75f5f
bright2=b5cea8
bright3=f0d399
bright4=9ec1e8
bright5=c7a3cf
bright6=9ed7e2
bright7=eceff4

# 16 y 17 son los dos acentos propios que ya define alacritty.toml.
16=d08770
17=8c1515

selection-foreground=d8dee9
selection-background=3b4252
# Amarillo = hay coincidencia pero no es la actual; verde = la que esta puesta.
search-box-no-match=0f1115 bf616a
search-box-match=0f1115 ebcb8b
jump-labels=0f1115 ebcb8b
urls=88c0d0
scrollback-indicator=0f1115 4c566a

# Transparencia leve, y esta vez medida. El fondo deja pasar un 8% de lo que
# haya detras, y quien lo desenfoca es Hyprland con su propio blur
# (decoration:blur:enabled=1, size=3, comprobado con hyprctl getoption). Por eso
# la opcion `blur` de foot NO se activa: la suya necesita que el compositor
# implemente ext-background-effect-v1 y solo hace falta donde el compositor no
# difumine por su cuenta. Aqui seria redundante.
#
# Que la transparencia se aplica de verdad se comprueba a pixel, no a ojo -- a
# 0.85 sobre una zona oscura del fondo el cambio es invisible y parece que no
# funciona. Capturando la misma region con grim: alpha=1.0 promedia RGB
# [15,17,21], que es este mismo #0f1115; alpha=0.4 promedia [74,64,54], el
# fondo de pantalla asomando.
#
# 0.92 y no menos porque lo que manda es el contraste, no el efecto:
#
#     alpha   sobre este fondo   sobre un fondo BLANCO
#      1.00        14.0:1               14.0:1
#      0.92        13.5:1               11.5:1
#      0.80        12.8:1                7.6:1
#
# WCAG AAA pide 7:1 para texto normal. A 0.92 sobra margen hasta en el peor
# caso imaginable; a 0.80 se estaria en el limite si el fondo fuera claro.
# Ponerlo a 1.0 si alguna vez toca programar sobre un fondo con dibujo.
alpha=0.92

# ---------------------------------------------------------------------------
# El tema claro del Ctrl+Shift+t. Es el mismo Nord por el otro lado: Snow
# Storm de fondo, y los acentos oscurecidos para que contrasten sobre blanco
# -- los de arriba, tal cual, serian ilegibles en un proyector.
# ---------------------------------------------------------------------------

[colors-light]
background=eceff4
foreground=2e3440
cursor=eceff4 2e3440

regular0=3b4252
regular1=99323c
regular2=4f7a3c
regular3=8a6d1f
regular4=3b6ea8
regular5=8b5e8f
regular6=327a8a
regular7=d8dee9

bright0=4c566a
bright1=bf616a
bright2=5f8f4a
bright3=a08028
bright4=5e81ac
bright5=a3739f
bright6=4b93a3
bright7=ffffff

16=b56a3f
17=8c1515

selection-foreground=2e3440
selection-background=d8dee9
search-box-no-match=eceff4 99323c
search-box-match=2e3440 ebcb8b
jump-labels=2e3440 ebcb8b
urls=327a8a
scrollback-indicator=eceff4 4c566a
alpha=1.0
