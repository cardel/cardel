# hypridle -- que hacer cuando el equipo se queda quieto.
#
# No habia nada de esto: hyprlock estaba instalado y configurado, pero nada lo
# disparaba, asi que la pantalla no se apagaba ni se bloqueaba sola nunca.
#
# Los tiempos estan pensados para un portatil de clase: la pantalla no se apaga
# a mitad de una explicacion, y el equipo no se queda abierto toda la noche.
# Para una clase larga sin tocar el teclado hay un atajo que pausa todo esto,
# SUPER+I, que es mas fiable que estirar los tiempos.
#
# hypridle respeta los inhibidores de inactividad del protocolo de Wayland, asi
# que mpv y el navegador en pantalla completa ya lo frenan por su cuenta.
#
# Ojo con la sintaxis de hyprctl: en 0.57 `dispatch` recibe Lua, asi que
# `hyprctl dispatch dpms on` falla con "')' expected near 'on'". Va la forma
# nueva.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 2 min 30: bajar el brillo, que es reversible y avisa de lo que viene.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: bloquear.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5 min 30: apagar la pantalla.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspender.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
