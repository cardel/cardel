# hypridle -- que hacer cuando el equipo se queda quieto.
#
# SIN BLOQUEO AUTOMATICO, A PROPOSITO
#
# Lo tenia a los 5 minutos y se quito el 29 de octubre de 2026 por dos razones.
# La primera, decision de Carlos: prefiere bloquear el mismo desde el menu.
# La segunda la obligaba de todos modos: hyprlock 0.9.6 tumba la sesion entera
# con Hyprland 0.57.0, asi que un bloqueo automatico era una forma segura de
# perder lo que estuviera abierto. El detalle esta en bloquear.sh.
#
# Lo que si queda es apagar la pantalla y suspender, que no pasan por el
# bloqueador y no han dado problema.
#
# Bloquear a mano: CTRL+ALT+L, o SUPER+A y la opcion Lock. Las dos pasan por
# bloquear.sh, que nunca llama a hyprlock.
#
# hypridle respeta los inhibidores de inactividad del protocolo de Wayland, asi
# que mpv y el navegador en pantalla completa lo frenan por su cuenta. Para una
# clase larga sin tocar el teclado esta SUPER+I, que lo pausa entero.
#
# Ojo con la sintaxis de hyprctl: en 0.57 `dispatch` recibe Lua, asi que
# `hyprctl dispatch dpms on` falla con "')' expected near 'on'".

general {
    # Lo usa `loginctl lock-session`, que es lo que corre antes de suspender.
    lock_cmd = bloquear.sh
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 2 min 30: bajar el brillo, que es reversible y avisa de lo que viene.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min 30: apagar la pantalla. No bloquea.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspender. Esto si bloquea antes, por before_sleep_cmd.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
