## Overrides ##

# Place your custom options here
# Options placed here will not be touched after an update
# Copy options from the base config or go to the hyprland wiki for more options
# See examples below

# Keyboard layout
# Go to https://wiki.hyprland.org/Configuring/Variables/#input for more information
input {
    kb_layout = us, latam
    kb_variant =
    kb_options = grp:win_space_toggle
}

# Go to /etc/sddm.conf.d/hyprland.conf to edit sddm's monitor settings
# Go to https://wiki.hyprland.org/Configuring/Monitors/ for more information
#
# monitor = name, resolution, position, scale

# PC de mesa  <-- activo
monitor = DP-3, 1920x1080@60, 0x0, 1
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1
#monitor = HDMI-A-2, 1600x1200@60, 1920x0, 1

# Portatil  <-- comentar el bloque de arriba y descomentar este.
# HDMI-A-1 aparece en ambos con posiciones distintas, por eso no pueden
# convivir activos los dos bloques.
#monitor = eDP-1, 1920x1080@60, 0x0, 1
#monitor = HDMI-A-1, 1920x1080@60, 0x0, 1, mirror, eDP-1
#monitor = DP-1, 1920x1080@60, 1920x0, 1

# See https://wiki.hyprland.org/Configuring/Variables/ for more
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 2
    # Set active window borders to pywal color
    col.active_border = $color3
    col.inactive_border = 0xff363737
    layout = master

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false
}

## Autostart ##

# Redundante hoy pero inofensivo: el paquete gnome-keyring habilita
# gnome-keyring-daemon.socket (activacion por demanda) y /etc/pam.d/sddm ya trae
# pam_gnome_keyring.so con auto_start, que es lo unico que ademas *desbloquea* el
# llavero con la clave de login. "--start" solo inicializa el daemon existente.
# Se queda como red de seguridad por si el socket de systemd queda deshabilitado.
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = pcloud
#exec-once = ~/.local/bin/start-wayvnc.sh

# ProtonVPN: el paquete es proton-vpn-gtk-app y su binario se llama
# `protonvpn-app`. No existe ningun `proton-vpn` ni `protonvpn-cli` -- ese
# paquete no trae CLI, asi que un exec-once con esos nombres falla en silencio
# (era el caso en el portatil hasta 2026-08-20). Descomentar donde el paquete
# este instalado; --start-minimized lo deja en la bandeja, que waybar si
# muestra ("tray" esta en modules-left).
#
# Arrancar la app NO es lo mismo que conectar: quien conecta solo es
# `connect_at_app_startup` en ~/.config/Proton/VPN/app-config.json. Venia en
# "FASTEST", que es por que la VPN se levantaba sola a los pocos segundos de
# abrir la app. Con null no conecta hasta que se le pide. Equivale a
# Ajustes > General > Auto connect, escribiendo OFF en la casilla.
#exec-once = protonvpn-app --start-minimized

## Custom apps ##

# gromit-mpx solo esta instalado como flatpak; el binario nativo no existe.
# hyprbinds.conf ya usa SUPER+C para $CALCULATOR y Hyprland NO reemplaza el bind
# anterior: registra los dos y quedan en colision. Hay que soltarlo explicitamente.
# La calculadora sigue disponible en la tecla XF86Calculator.
unbind = SUPER, C
# Invocar el flatpak sin opciones solo sirve la primera vez: con gromit ya
# corriendo, la segunda invocacion no arranca otra instancia sino que le manda
# opciones a la primera ("Unknown Option to control a running Gromit-MPX
# process"), y sin opciones no manda nada. Resultado: SUPER+C arrancaba gromit y
# despues no hacia nada.
#
# --toggle activa y desactiva el modo dibujo. Si gromit no esta corriendo, esta
# misma linea lo arranca ya en modo activo, asi que no hace falta un exec-once.
bind = SUPER, C, exec, flatpak run net.christianbeier.Gromit-MPX --toggle # Gromit-MPX: dibujar si/no

# El resto de acciones tambien tienen que venir de aqui, y no de las teclas
# propias de gromit (F9 dibujar, F8 deshacer), porque bajo Hyprland no llegan.
#
# Con --debug se ve lo que hace y por que no basta:
#   DEBUG: Grabbing hot key 'F9' from keyboard '3'
#   DEBUG: Grabbing undo key 'F8' from keyboard '3'
#   Enabled Device 0: "Virtual core pointer" / Now 1 enabled devices.
#
# Graba las teclas en XWayland, no en el compositor. Un grab de XWayland solo
# recibe pulsaciones mientras una ventana X tiene el foco, y la superposicion de
# gromit no lo toma nunca -- justamente para dejar clicar lo que hay debajo. De
# paso se ve que el MPX del nombre tampoco sobrevive: un unico dispositivo en
# vez de los punteros separados.
#
# Un `flatpak run` con opciones tarda 130 ms medidos, asi que sirve de atajo.
bind = SUPER, U, exec, flatpak run net.christianbeier.Gromit-MPX --undo # Gromit-MPX: deshacer trazo
bind = SUPER SHIFT, U, exec, flatpak run net.christianbeier.Gromit-MPX --redo # Gromit-MPX: rehacer trazo
bind = SUPER SHIFT, C, exec, flatpak run net.christianbeier.Gromit-MPX --clear # Gromit-MPX: borrar todo
bind = SUPER ALT, C, exec, flatpak run net.christianbeier.Gromit-MPX --visibility # Gromit-MPX: ocultar/mostrar
bind = SUPER, X, exec, obs # OBS
bind = SUPER, Z, exec, xournalpp # Xournal++

# hyprbinds.conf llama a "Refresh.sh", pero el script es ~/.local/bin/refresh.sh
unbind = SUPER SHIFT, R
bind = SUPER SHIFT, R, exec, refresh.sh # Refresh hyprland

## Teclas multimedia ##
# La seccion equivalente de hyprbinds.conf esta comentada, asi que sin esto
# no queda ningun bind XF86 salvo XF86Calculator.

bindel = , XF86AudioRaiseVolume, exec, volume.sh --inc # Volume up
bindel = , XF86AudioLowerVolume, exec, volume.sh --dec # Volume down
bindl = , XF86AudioMute, exec, volume.sh --toggle # Toggle mute
bindl = , XF86AudioMicMute, exec, volume.sh --toggle-mic # Toggle Microphone

bindl = , XF86AudioPrev, exec, playerctl previous # Previous track
bindl = , XF86AudioNext, exec, playerctl next # Next track
bindl = , XF86AudioPlay, exec, playerctl play-pause # Pause media
bindl = , XF86AudioStop, exec, playerctl stop # Stop media

bindel = , XF86MonBrightnessUp, exec, brightness.sh --inc # Brightness up
bindel = , XF86MonBrightnessDown, exec, brightness.sh --dec # Brightness down

## Tableta grafica ##

# La config de la M708 se movio a user_configs/local.conf: la salida a la que se
# mapea y el recorte del area activa dependen del monitor de cada maquina, asi
# que no tiene sentido versionarlas.

## Window rules ##

windowrule {
  name = gromit-crisp
  match:class = ^(gromit-mpx|Gromit-mpx)$

  no_blur = on
  no_dim = on
  opacity = 1.0 override 1.0 override 1.0 override

  # Opcionales (prueba si aun lo notas raro):
  # opaque = on
  # force_rgbx = on

  # Si quieres comportamiento tipo overlay:
  float = on
  pin = on

  # Una sola pantalla.
  #
  # gromit no tiene ninguna opcion de monitor -- las unicas que acepta el
  # binario son --active --clear --debug --key --keycode --line --opacity
  # --quit --redo --reload --toggle --undo --undo-key --undo-keycode --version
  # --visibility. Se dibuja sobre la pantalla X entera, que en XWayland es la
  # caja que engloba todas las salidas: aqui 3840x1080, las dos juntas.
  #
  # Y sin regla, donde cae depende del monitor con foco al arrancarlo: medido
  # abriendo en at=[1920,0] una vez y en at=[0,0] otra, siempre con
  # size=[3840,1079]. En el primer caso el lienzo queda corrido una pantalla
  # entera respecto a las coordenadas que gromit cree tener.
  #
  # `monitor` es imprescindible: sin el, `move` de una ventana flotante se
  # interpreta relativo al monitor donde Hyprland la deje caer, que es el que
  # tenga el foco. Medido: con foco en HDMI-A-1 y sin esta linea, gromit
  # aparecia en at=[1920,0]; con ella cae en at=[0,0] aunque el foco siga en la
  # otra pantalla.
  #
  # Es el mismo par PC de mesa / portatil que el bloque de monitores de arriba:
  # cambiar la salida al comentar aquel.
  monitor = DP-3      # PC de mesa
  # monitor = eDP-1   # Portatil
  move = 0 0
  size = 1920 1080
}

## Config local por maquina ##

# Todo lo que dependa del hardware de un PC concreto (que monitor tiene cada
# escritorio, por ejemplo) va en user_configs/local.conf, que NO se versiona.
# Este source es solo el gancho; la configuracion en si se queda fuera del repo.
#
# En una maquina nueva hay que crear ese archivo aunque quede vacio: un source
# apuntando a algo inexistente es error de config. Un comodin no lo arregla,
# "source = local-*.conf" sin coincidencias tambien falla (probado en 0.56.2).
source = local.conf

# Nota: initial_boot.sh anade automaticamente "source = touchpad.conf" al final
# de este archivo cuando detecta un touchpad, y genera user_configs/touchpad.conf.
# No lo pongas a mano: en una maquina sin touchpad el archivo no existe y
# Hyprland reporta un error de config.
