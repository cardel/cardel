# Parametros del modulo v4l2loopback -> /etc/modprobe.d/v4l2loopback.conf
#
# Crea la camara virtual que OBS rellena y que Zoom (o Meet, o Chromium en
# general) consume. El porque de cada opcion esta en obs/README.md; el resumen:
#
#   devices=1        una sola camara virtual, no hacen falta mas
#   video_nr=10      /dev/video10, lejos de video0/video1 que ya ocupa la webcam
#   card_label       el nombre que aparece en el desplegable de Zoom
#   exclusive_caps=1 sin esto Chromium no lista el dispositivo: el nodo anuncia
#                    salida Y captura a la vez y el navegador lo descarta
options v4l2loopback devices=1 video_nr=10 card_label="OBS Virtual Camera" exclusive_caps=1
