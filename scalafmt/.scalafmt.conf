# Configuracion de scalafmt para todas las maquinas y proyectos de esta cuenta.
#
# Metals la busca aqui porque ~/.config/nvim/lua/plugins/scala.lua fija
# scalafmtConfigPath. Sin ella, al guardar un .scala Metals pregunta
# "No .scalafmt.conf file detected" con tres opciones, y la peticion de formato
# expira antes de que de tiempo a responder: el aviso vuelve en cada :w.
#
# Vive fuera de los repositorios a proposito: los proyectos de clase y los de
# los estudiantes no llevan un .scalafmt.conf que nadie pidio.

version = "3.10.6"

# El dialecto va en scala3 aunque casi todos los proyectos sean 2.13.18.
#
# Metals exige que el dialecto cubra el del build target, y un .scala suelto
# -- los de ~/repositorios/clases -- lo compila scala-cli, que es Scala 3. Con
# scala213 ese caso falla con "Required scalafmt dialect rewrite to 'scala3'" y
# no formatea. Al reves no pasa: medido el 2026-10-01 sobre una copia de
# IdeaProjects/pepito (2.13.18), con scala3 formatea sin quejarse.
#
# Los 14 archivos de clase se analizan igual con los dos dialectos, asi que el
# codigo Scala 2 del curso no pierde nada.
runner.dialect = scala3

maxColumn = 100

# El formato de la biblioteca estandar, que es el que ve el estudiante en la
# documentacion de Scala.
align.preset = none
docstrings.style = Asterisk
rewrite.rules = [RedundantBraces, RedundantParens, SortImports]
rewrite.redundantBraces.stringInterpolation = true

# Un .sbt no es Scala corriente: lleva su propio dialecto.
fileOverride {
  "glob:**/*.sbt" { runner.dialect = sbt1 }
  "glob:**/project/*.scala" { runner.dialect = scala212 }
}
