# Nota: yazi >= 26 rechaza la clave "$schema" (las claves deben ser kebab-case).

# Previsualización de imágenes y PDF con chafa.
#
# Alacritty no implementa ningún protocolo gráfico (ni kitty ni sixel), así que
# los adaptadores rápidos de yazi quedan descartados. El que yazi elige solo en
# esta máquina es `Wayland`, porque `Adapter::matches` decide por el entorno
# (XDG_SESSION_TYPE / WAYLAND_DISPLAY / DISPLAY) y no por qué binarios existen;
# ese adaptador delega en ueberzugpp, que no está instalado, y falla en silencio.
#
# yazi trae un adaptador chafa, pero solo cae en él cuando *no* logra detectar
# la sesión gráfica: forzarlo exigiría arrancar con
# `env -u XDG_SESSION_TYPE -u WAYLAND_DISPLAY -u DISPLAY yazi`, y esa ceguera la
# heredarían todos los procesos hijos (xdg-open, wl-copy). En vez de eso se
# invoca chafa como previewer vía piper, que pinta su salida ANSI en el panel.
#
# Flags de chafa que importan:
#   --polite on    no emitir secuencias de cursor (?25l/?25h) que ensuciarían
#                  el panel, ya que aquí la salida es texto, no una sesión.
#   --relative off terminar cada fila con salto de línea en vez de mover el
#                  cursor, que es lo que piper lee línea a línea.
#   --view-size    piper expone el tamaño del panel como $w y $h.
#   --font-ratio   ver abajo. Sin esto las imágenes salen estiradas a lo alto.
#
# Sobre --font-ratio: chafa tiene que saber la forma de una celda del terminal
# para no deformar la imagen, y asume 1:2 por defecto. La celda real aquí no es
# esa. JetBrainsMono Nerd Font Mono declara, en unidades de 1000 por em:
#
#     avance horizontal  600
#     alto de línea      1320   (ascent 1020 + descent 300 + lineGap 0)
#
# o sea una relación de 600/1320 = 0.4545, no 0.5. Un 9% de diferencia, y se
# nota: medido sobre una página carta (aspecto real 0.7727), chafa la pintaba
# con un aspecto físico de 0.6992 -- un 9.5% estrecha, es decir estirada a lo
# alto. Pasándole la relación real baja a 0.7575, un 2%, que ya no se aprecia.
#
# El valor va como fracción y no como decimal porque es exactamente lo que
# declara la fuente. Si algún día se cambia la tipografía del terminal hay que
# recalcularlo:
#
#     python -c "from fontTools.ttLib import TTFont as T; f=T('RUTA.ttf'); \
#       h=f['hhea']; print(f['hmtx']['A'][0], h.ascent-h.descent+h.lineGap)"

[[plugin.prepend_previewers]]
mime = "image/*"
run = 'piper -- chafa -f symbols --polite on --relative off --font-ratio 600/1320 --view-size "${w}x${h}" "$1"'

# Los PDF se previsualizan como TEXTO, no como imagen.
#
# La versión anterior rasterizaba la primera página con pdftoppm y la pasaba por
# chafa, y no se veía nada. No es un fallo de configuración, es aritmética: una
# página carta a 150 dpi son 1275x1650 px y el panel son unas 60x39 celdas, o
# sea un reescalado de 20x. A esa escala un párrafo es una mancha gris. Corregir
# la relación de aspecto (--font-ratio, ver arriba) arregla la deformación, pero
# no hace legible lo que no cabe.
#
# Y no hay salida por arriba: Alacritty 0.17 sigue sin implementar ningún
# protocolo gráfico -- comprobado, no hay ni una cadena de sixel o kitty en el
# binario, ni en el man, ni en el changelog -- así que la previsualización solo
# puede ser texto o arte ASCII.
#
# pdftotext sí es legible: da el título, los autores y el resumen, que es
# justamente lo que sirve para reconocer un archivo en una lista. Medido sobre
# un paper: 567 líneas útiles y ni un carácter de control.
#
#   -layout    conserva la disposición (títulos centrados, columnas), que ayuda
#              a distinguir de un vistazo una portada de una página de contenido
#   -nopgbrk   quita los saltos de página, que si no salen como ^L
#   -f 1 -l 10 diez páginas: yazi deja desplazar la previsualización, así que
#              vale la pena tener más de una
#   fold -s    pliega por espacios al ancho del panel en vez de recortar; sin
#              esto se pierden ~10 columnas de cada línea, porque pdftotext saca
#              hasta 70 y el panel ronda las 60
#
# Para ver el PDF de verdad, `o` lo abre en el visor del sistema.
[[plugin.prepend_previewers]]
mime = "application/pdf"
run = 'piper -- pdftotext -f 1 -l 10 -layout -nopgbrk "$1" - | fold -s -w "${w}"'
